# 체험 서버 실행 — 실행 이력을 볼륨에 보존합니다.
#
#   docker compose up -d        # 브라우저에서 http://localhost:8100
#   docker compose down         # 종료 (실행 이력은 남음)
#   docker compose down -v      # 종료하고 실행 이력까지 삭제
services:
  pipeline:
    image: ghcr.io/soadri/ai-model-ir-pipeline:0.1
    platform: linux/amd64
    ports:
      - "127.0.0.1:8100:8100"   # 이 PC에서만 접속 (사용자 모델 코드를 실행하므로 외부에 열지 마세요)
    volumes:
      - pipeline-data:/data
    restart: unless-stopped

volumes:
  pipeline-data:
