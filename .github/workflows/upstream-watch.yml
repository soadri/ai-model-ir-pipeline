# 매주: 고정 의존성을 지금도 받을 수 있는지, 상류에 새 버전이 나왔는지 확인하고
#       직전 확인과 달라졌으면 `upstream` 라벨 Issue를 만들거나 갱신
name: Upstream 변화 추적

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 (KST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: 의존성·상류 버전 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 확인 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upstream_watch.py
